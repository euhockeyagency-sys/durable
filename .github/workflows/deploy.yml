name: Deploy to server

# Push to main -> run tests -> deploy to the UpCloud server.
# The deploy key on the server is restricted to running deploy.sh only.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase migration secrets are not configured; skipping schema deployment."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push
          supabase db advisors

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 5.22.215.5 >> ~/.ssh/known_hosts 2>/dev/null
          # The key is locked to `cd /opt/eha && bash deploy.sh` on the server side.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes root@5.22.215.5

      - name: Verify the canonical site and www redirect
        run: |
          sleep 5
          curl -fsS -o /dev/null https://eurohockeyagency.com/

          HEALTH=$(curl -fsS https://eurohockeyagency.com/api/health)
          node -e 'const health=JSON.parse(process.argv[1]); if (health.ok !== true) process.exit(1)' "$HEALTH"

          EXPECTED_SOURCE_SHA=$(sha256sum public/en/index.html | awk '{print $1}')
          LIVE_HEADERS=$(curl -fsSI https://eurohockeyagency.com/)
          LIVE_SOURCE=$(printf '%s\n' "$LIVE_HEADERS" | awk -F': ' 'tolower($1)=="x-eha-source"{print $2}' | tr -d '\r')
          LIVE_SOURCE_SHA=$(printf '%s\n' "$LIVE_HEADERS" | awk -F': ' 'tolower($1)=="x-eha-source-sha256"{print $2}' | tr -d '\r')
          test "$LIVE_SOURCE" = "en/index.html"
          test "$LIVE_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"

          RU_SOURCE=$(curl -fsSI https://eurohockeyagency.com/ru/ \
            | awk -F': ' 'tolower($1)=="x-eha-source"{print $2}' | tr -d '\r')
          test "$RU_SOURCE" = "ru/index.html"

          LEGACY_REDIRECT=$(curl -sS --max-redirs 0 -o /dev/null \
            -w '%{http_code}|%{redirect_url}' \
            'https://eurohockeyagency.com/about-the-agent')
          test "$LEGACY_REDIRECT" = '301|https://eurohockeyagency.com/agent'

          REDIRECT=$(curl -sS --max-redirs 0 -o /dev/null \
            -w '%{http_code}|%{redirect_url}' \
            'https://www.eurohockeyagency.com/guides?source=deploy')
          test "$REDIRECT" = '301|https://eurohockeyagency.com/guides?source=deploy'

          echo "canonical site and www redirect are healthy"
